<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Бизнес-платформа{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Платформа</a>
    <div>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/projects/">Проекты</a></li>
        <li class="nav-item"><a class="nav-link" href="/tasks/create/">Создать задачу</a></li>
        <li class="nav-item"><a class="nav-link" href="/documents/">Документы</a></li>
        <li class="nav-item"><a class="nav-link" href="/messages/">Сообщения</a></li>
      </ul>
    </div>
    <div class="d-flex">
        {% if user.is_authenticated %}
            <span class="text-white me-2">Привет, {{ user.username }}!</span>
            <a class="btn btn-outline-light" href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a class="btn btn-outline-light" href="{% url 'login' %}">Войти</a>
        {% endif %}
    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
