<!-- core/templates/core/project_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Projects</title>
</head>
<body>
    <h1>Project List</h1>
    <ul>
        {% for project in projects %}
            <li>{{ project.name }} - {{ project.description }}</li>
        {% empty %}
            <li>No projects available.</li>
        {% endfor %}
    </ul>
</body>
</html>
